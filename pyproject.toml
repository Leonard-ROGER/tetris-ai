[project]
name = "tetris-ai"
version = "0.1.0"
description = "Terminal Tetris with an adaptive AI opponent"
readme = "README.md"
authors = [
    { name = "Léonard Roger", email = "123603890+Leonard-ROGER@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "keyboard>=0.13.5",
]

[project.scripts]
tetris = "tetris_ai.game:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
